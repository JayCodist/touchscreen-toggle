name: 🐛 Bug report
description: Report a bug or a device that the extension does not detect or toggle correctly
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: What happened and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Click the panel icon
        2. Toggle "..."
        3. See error
    validations:
      required: true
  - type: input
    id: gnome
    attributes:
      label: GNOME Shell version
      placeholder: For example, 50.1. Run: gnome-shell --version
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distribution
      placeholder: For example, Ubuntu 26.04
    validations:
      required: true
  - type: textarea
    id: devices
    attributes:
      label: Touchscreen device info
      description: Help us support your hardware. Paste the output of the command below.
      render: shell
      placeholder: |
        udevadm info -e | grep -B5 ID_INPUT_TOUCHSCREEN=1
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional. Output of `journalctl --user -b | grep -i touchscreen`
      render: shell
